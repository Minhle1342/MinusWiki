<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #111827;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    body {
      width: 340px;
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 20px;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-icon {
      background: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      color: white;
    }

    .title { 
      font-size: 18px; 
      font-weight: 700; 
      letter-spacing: -0.5px;
    }
    
    .title span { color: #6366f1; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
    }

    select, input, textarea {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text-primary);
      transition: all 0.2s ease;
      font-size: 13px;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      outline: none;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      font-size: 14px;
    }

    .btn:hover:not(:disabled) { 
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    
    .btn:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 15px;
      padding: 10px;
      border-radius: var(--radius);
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-icon">-</div>
    <div class="title">Minus<span>Wiki</span></div>
  </div>

  <div class="form-group">
    <label for="server-select">Máy chủ</label>
    <select id="server-select">
      <option value="http://localhost:3000">Localhost (3000)</option>
      <option value="https://minuswiki-production.up.railway.app">Production (Railway)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="project-select">Dự án</label>
    <select id="project-select">
      <option value="" disabled selected>Đang kết nối...</option>
    </select>
  </div>

  <div class="form-group">
    <label for="clip-title">Tiêu đề</label>
    <input type="text" id="clip-title" placeholder="Nhập tiêu đề...">
  </div>

  <div class="form-group">
    <label for="clip-text">Nội dung</label>
    <textarea id="clip-text" placeholder="Trích dẫn nội dung..."></textarea>
  </div>

  <button id="btn-submit" class="btn" disabled>Nạp tri thức</button>

  <div id="status" class="status-message"></div>

  <script src="popup.js"></script>
</body>
</html>
